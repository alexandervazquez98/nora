# Public example inventory for the PMP 450i SNMP driver.
#
# Copy this file to `data/devices.yaml` and replace the placeholders
# before booting NORA. NEVER commit `data/devices.yaml` (see
# .gitignore — the file is excluded from version control).
#
# Hosts use RFC 5737 documentation prefixes (192.0.2.x); credentials
# are all `change-me`. Replace the values with your real inventory
# before any deployment.

devices:
  - device_id: ap-7400-01
    vendor: cambium
    model: pmp450i
    firmware: 15.2.1
    host: 192.0.2.10
    port: 161
    snmp_version: v2c
    community: change-me

  - device_id: sm-7400-02
    vendor: cambium
    model: pmp450i
    firmware: 15.2.1
    host: 192.0.2.11
    port: 161
    snmp_version: v3
    auth_password: change-me
    priv_password: change-me
