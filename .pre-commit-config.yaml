# .pre-commit-config.yaml
#
# Local pre-commit hooks. The `no-env-staging` guard rejects any commit
# that stages a file named `.env` (allows `.env.example`, `.env.test`,
# `.env.local`, etc.).
#
# Per secure-configuration spec, Requirement "`.env` Is Never Tracked",
# Scenario "accidental staging is rejected":
#     GIVEN a developer runs `git add .env --force`
#     WHEN the pre-commit hook runs
#     THEN the commit is rejected with a clear message
#
# The guard script lives at `scripts/check-no-env-staged.sh`. It reads
# paths from `git diff --cached --name-only --diff-filter=ACMRT` and
# rejects any path matching `^\.env$` or `^.*/\.env$`.
repos:
  - repo: local
    hooks:
      - id: no-env-staging
        name: Block .env file staging
        entry: scripts/check-no-env-staged.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]
