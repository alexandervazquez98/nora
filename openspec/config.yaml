---
# openspec/config.yaml — SDD configuration for NORA (repo: enlaces)
# Generated by sdd-init. Detected from real repository evidence only.
schema: spec-driven

project: enlaces
initialized: 2026-09-05
artifact_store: openspec

context: |
  Product: NORA (Network Operations & Remediation Assistant) — agnostic NOC telemetry,
  root-cause diagnosis and human-approved remediation. Scope of record: SCOPE.md.
  Tech stack: Python 3.9.6 (system interpreter, no venv, no dependency manifest yet).
  State: greenfield — only LICENSE (Apache 2.0) and SCOPE.md are tracked; no src/ or tests/.
  Prototypes: .reportes/ (gitignored) — ~20 throwaway scripts: hand-rolled SNMP BER over sockets, ICMP via subprocess, matplotlib/numpy charts, reportlab PDFs.
  Target architecture (SCOPE.md, not built yet): provider factory/adapter for multi-LLM
  (LM Studio + Google Gemini), SNMP/SSH driver layer, HITL ChangeRequest state machine with
  rollback watchdog, FastMCP + FastAPI, Pydantic Settings, telemetry sanitizer.
  Style: zero hardcoded IPs/credentials/topologies; secrets only via .env; Spanish docs, English code.

# Testing capabilities — detected at environment level on 2026-09-05.
# IMPORTANT: nothing here is declared by the project. There is no pyproject.toml,
# requirements.txt, pytest.ini, Makefile or CI workflow. These tools are installed on
# the machine and were verified runnable. Phase 1 MUST pin them in a real manifest.
testing:
  strict_tdd: true
  strict_tdd_basis: >-
    No TDD marker and no project config found, but a working test runner was verified
    (python3 -m pytest -> pytest 8.4.2). Per SDD decision gates the runner-present
    default applies. Declared at environment level, not by the project.
  declared_by_project: false
  interpreter: python3 3.9.6 (/Library/Developer/CommandLineTools)
  runner:
    framework: pytest 8.4.2
    command: python3 -m pytest
    plugins_detected:
      - anyio 4.12.1
      - timeout 2.4.0
    note: >-
      The bare `pytest` console script is broken in this environment; always invoke via
      `python3 -m pytest`. Verified: collects 0 items, exit 0. `ruff` honors .gitignore,
      so .reportes/ is excluded from lint and format runs.
  layers:
    unit:
      available: true
      tool: pytest 8.4.2
    integration:
      available: true
      tool: httpx 0.28.1 + fastapi 0.128.8 TestClient
      note: Tooling is installed; no integration tests exist yet.
    e2e:
      available: false
      tool: null
      note: No playwright/cypress/selenium detected; NORA is a backend/MCP service.
  coverage:
    available: false
    command: null
    note: pytest-cov and coverage are both absent. Phase 1 must add pytest-cov.
  quality:
    linter:
      available: true
      command: ruff check .
      tool: ruff 0.15.18
      note: Installed globally; no ruff.toml or [tool.ruff] section in the project.
    type_checker:
      available: false
      command: null
      note: mypy and pyright both absent. SCOPE.md relies on strict typing — add one.
    formatter:
      available: true
      command: ruff format .
      tool: ruff 0.15.18
  installed_libraries:
    verified_present:
      - pytest 8.4.2
      - ruff 0.15.18
      - httpx 0.28.1
      - fastapi 0.128.8
      - pydantic 2.13.4
      - paramiko 5.0.0
      - numpy 2.0.2
      - matplotlib 3.9.4
      - reportlab 5.0.1
    declared_in_scope_but_missing:
      - fastmcp
      - google-genai
      - pysnmp
      - netmiko
      - pydantic-settings
      - onvif
      - requests
      - pytest-cov

rules:
  proposal:
    - State which SCOPE.md roadmap phase (1-5) the change belongs to.
    - Include a rollback plan for anything that writes to network devices.
    - Reject any proposal that introduces autonomous device mutation without HITL approval.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Every device-write requirement MUST specify its approval token and rollback timeout.
    - Every telemetry path MUST specify what the sanitizer masks before it leaves the process.
  design:
    - Document architecture decisions with rationale.
    - Include sequence diagrams for HITL approval and rollback-watchdog flows.
    - Keep drivers behind interfaces; no vendor detail leaks into the core.
    - No IP addresses, hostnames, serial numbers or credentials in any design artifact.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
    - The first task of the first change MUST create the dependency manifest and test layout.
  apply:
    guidelines:
      - Follow existing code patterns; there is no src/ yet, so the first change sets them.
      - Load configuration through Pydantic Settings; never read os.environ inline.
      - Treat .reportes/ as throwaway prototypes — port logic deliberately, do not import it.
      - Never commit .env, credentials, real IPs or topology data.
    tdd: true
    test_command: uv run python -m pytest
  verify:
    test_command: uv run python -m pytest
    build_command: uv run ruff check . && uv run ruff format --check . && uv run mypy --strict src/nora
    coverage_threshold: 0
    coverage_note: >-
      Threshold stays 0 until pytest-cov is installed and pinned in the manifest;
      raise it in the change that adds coverage.
  archive:
    - Warn before merging destructive deltas.
    - Confirm no secrets or real infrastructure identifiers entered openspec/specs/.
