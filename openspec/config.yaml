---
# openspec/config.yaml — SDD configuration for NORA (repo: enlaces)
# Generated by sdd-init. Detected from real repository evidence only.
schema: spec-driven

project: enlaces
initialized: 2026-09-05
artifact_store: openspec

context: |
  Product: NORA (Network Operations & Remediation Assistant) — agnostic NOC telemetry,
  root-cause diagnosis and human-approved remediation. Scope of record: SCOPE.md.
  Tech stack: Python 3.12 (uv-managed venv), hatchling build backend, real `src/nora/`
  package with Pydantic Settings, FastMCP server, telemetry sanitizer, lmstudio and
  google-genai SDK adapters, pytest test suite under `tests/`.
  State: foundation-bootstrap landed — Phase 1 toolchain + LLM provider + sanitizer +
  FastMCP server shipped. Driver layer (Phase 2) and HITL ChangeRequest (Phase 3)
  remain out of scope.
  Target architecture (SCOPE.md): provider factory/adapter for multi-LLM
  (LM Studio + Google Gemini), SNMP/SSH driver layer, HITL ChangeRequest state machine
  with rollback watchdog, FastMCP, Pydantic Settings, telemetry sanitizer.
  Style: zero hardcoded IPs/credentials/topologies; secrets only via .env; Spanish docs,
  English code.

# Testing capabilities — refreshed post-foundation-bootstrap on 2026-09-10.
# Project now ships its own pyproject.toml, .venv, and pinned dependencies via uv.
testing:
  strict_tdd: true
  strict_tdd_basis: >-
    No TDD marker and no project config found at init, but a working test runner was
    verified. Per SDD decision gates the runner-present default applies. Confirmed
    in foundation-bootstrap: pytest-cov is now pinned in [dependency-groups].dev.
  declared_by_project: true
  interpreter: python 3.12 (uv-managed .venv)
  runner:
    framework: pytest 9.x
    command: uv run python -m pytest --cov=src/nora --cov-report=term-missing
    plugins_detected:
      - pytest-cov 7.x
      - timeout 2.4
      - anyio 4.x
    note: >-
      Coverage is now wired into the default verify command via R4 of
      foundation-bootstrap-cleanup; threshold is 85%.
  layers:
    unit:
      available: true
      tool: pytest 9.x
    integration:
      available: true
      tool: pytest subprocess pattern (real binary boot)
      note: No external httpx TestClient tests in foundation-bootstrap.
    e2e:
      available: false
      tool: null
      note: NORA is a backend/MCP service — no browser-driven E2E.
  coverage:
    available: true
    command: pytest-cov 7.x
    note: Wired into verify.test_command via R4 of foundation-bootstrap-cleanup.
  quality:
    linter:
      available: true
      command: uv run ruff check .
      tool: ruff (pinned via pyproject.toml)
    type_checker:
      available: true
      command: uv run mypy --strict src/nora
      tool: mypy (pinned via pyproject.toml)
    formatter:
      available: true
      command: uv run ruff format --check .
      tool: ruff (pinned via pyproject.toml)
  installed_libraries:
    verified_present:
      - fastmcp>=3.2,<4
      - lmstudio>=1,<2
      - google-genai>=1,<3
      - pydantic-settings>=2
      - pytest>=8
      - pytest-cov>=5
      - pytest-timeout>=2.4
      - ruff>=0.6
      - mypy>=1.10

rules:
  proposal:
    - State which SCOPE.md roadmap phase (1-5) the change belongs to.
    - Include a rollback plan for anything that writes to network devices.
    - Reject any proposal that introduces autonomous device mutation without HITL approval.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Every device-write requirement MUST specify its approval token and rollback timeout.
    - Every telemetry path MUST specify what the sanitizer masks before it leaves the process.
  design:
    - Document architecture decisions with rationale.
    - Include sequence diagrams for HITL approval and rollback-watchdog flows.
    - Keep drivers behind interfaces; no vendor detail leaks into the core.
    - No IP addresses, hostnames, serial numbers or credentials in any design artifact.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
    - The first task of the first change MUST create the dependency manifest and test layout.
  apply:
    guidelines:
      - Follow existing code patterns; there is no src/ yet, so the first change sets them.
      - Load configuration through Pydantic Settings; never read os.environ inline.
      - Treat .reportes/ as throwaway prototypes — port logic deliberately, do not import it.
      - Never commit .env, credentials, real IPs or topology data.
    tdd: true
    test_command: uv run python -m pytest --cov=src/nora --cov-report=term-missing
  verify:
    test_command: uv run python -m pytest --cov=src/nora --cov-report=term-missing
    build_command: uv run ruff check . && uv run ruff format --check . && uv run mypy --strict src/nora
    coverage_threshold: 85
    coverage_note: >-
      Threshold raised to 85% now that pytest-cov is pinned in
      [dependency-groups].dev and wired into verify.test_command via R4 of
      foundation-bootstrap-cleanup. Edit when the suite grows.
  archive:
    - Warn before merging destructive deltas.
    - Confirm no secrets or real infrastructure identifiers entered openspec/specs/.