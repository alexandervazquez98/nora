[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nora"
version = "0.1.0"
description = "Network Operations & Remediation Assistant — Phase 1 toolchain foundation."
readme = "SCOPE.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "NORA Project" },
]
keywords = ["network-operations", "noc", "telemetry", "multi-llm", "hitl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fastmcp>=3.2,<4",
    "lmstudio>=1,<2",
    "google-genai>=1,<3",
    "pydantic-settings>=2",
    "puresnmp==2.0.1",
    "puresnmp-crypto>=1.0",
]

[project.scripts]
nora = "nora.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.4",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "snmpsim>=1.0",
    "pysmi>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nora"]

# ---------------------------------------------------------------------------
# Tool configuration. Lives here so a fresh `uv sync` produces a fully
# configured toolchain with no separate `ruff.toml` / `mypy.ini` files.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".reportes", ".atl", "openspec", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T201"]
"scripts/**/*.py" = ["T201"]

[tool.mypy]
strict = true
files = ["src/nora"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
