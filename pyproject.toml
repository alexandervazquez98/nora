[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nora"
version = "0.3.5"
description = "Network Operations & Remediation Assistant — Phase 1 toolchain foundation."
readme = "SCOPE.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "NORA Project" },
]
keywords = ["network-operations", "noc", "telemetry", "multi-llm", "hitl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fastmcp>=3.2,<4",
    "pydantic-settings>=2",
    "puresnmp==2.0.1",
    "puresnmp-crypto>=1.0",
    "packaging>=24.0",
    # Issue #70 / WU-1 — post-sweep `SpectrumAnalysis.xml` HTTP fetch.
    # Cambium PMP 450i radios expose the spectrum XML over plain HTTP
    # on their web root; the spectrum helper fetches it with bounded
    # retry / timeout. `httpx` is also used by tests via
    # `httpx.MockTransport` so production installs need the runtime dep.
    "httpx>=0.27",
    # Issue #61 / PR3 — PDF stability probe report generation.
    "reportlab>=4.0",
]

[project.scripts]
nora = "nora.__main__:main"
nora-mcp = "nora.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.6",
    "pytest-watch>=4.2",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "snmpsim>=1.0",
    "pysmi>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nora"]

# ---------------------------------------------------------------------------
# Tool configuration. Lives here so a fresh `uv sync` produces a fully
# configured toolchain with no separate `ruff.toml` / `mypy.ini` files.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".reportes", ".atl", "openspec", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T201"]
"scripts/**/*.py" = ["T201"]

[tool.mypy]
strict = true
files = ["src/nora"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--no-cov` keeps dev iteration fast (coverage still available via
# `make test` with --cov, see Makefile). `-p no:cacheprovider` avoids
# the `.pytest_cache` overhead since the repo manages its own caches.
# Parallelism (`-n auto`) is intentionally NOT in the default `addopts`:
# it speeds up the full suite but adds worker-spawn overhead per pytest
# invocation, which hurts single-file runs. The dev-loop targets
# `make test-fast` and `make test-one` opt into xdist explicitly.
addopts = "-q --strict-markers --no-cov -p no:cacheprovider"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "no_xdist: pre-existing flaky under pytest-xdist (filesystem state or TCP port binding); skipped by 'make test-fast', still runs in 'make test' (CI sequential)",
]
filterwarnings = [
    # `importlib.abc.Traversable` is deprecated in 3.12 and slated for
    # removal in 3.14; we import it conditionally because the canonical
    # `importlib.resources.abc.Traversable` only landed in 3.14. The
    # warning fires once at module import and has no functional impact.
    "ignore:'importlib.abc.Traversable' is deprecated:DeprecationWarning",
]
